name: Deploy at Production Server Best Computer Hub

run-name: >
  [BestComputerHub Production] ${{
    github.event_name == 'pull_request'
      && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('{0}: {1}', github.ref_name, github.event.head_commit.message)
  }}

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    name: Deploy to Production (Best Computer Hub)
    runs-on: ubuntu-latest

    environment:
      name: production-bestcomputerhub.com

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Copy code to production server
      - name: Upload backend code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: 10222
          source: "."
          target: ${{ secrets.PROD_BEST_COMPUTER_HUB_SERVER_PATH }}
          rm: false

      # 3. SSH into server & deploy
      - name: Deploy & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: 10222
          script: |
            set -e

            cd "${{ secrets.PROD_BEST_COMPUTER_HUB_SERVER_PATH }}"

            echo "🚀 Deploying commit: ${{ github.sha }}"

            echo "🔄 Activating virtual environment"
            source env/bin/activate

            echo "📦 Installing dependencies"
            pip install -r requirements.txt

            echo "🗄️ Running migrations"
            python manage.py migrate --noinput

            echo "🧹 Collecting static files"
            python manage.py collectstatic --noinput

            echo "♻️ Restarting Gunicorn"
            sudo systemctl restart ecommerce-backend.service

            echo "✅ Production deployment completed successfully"

