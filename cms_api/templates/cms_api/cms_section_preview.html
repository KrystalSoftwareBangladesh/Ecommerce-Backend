{# cms_api/templates/cms_api/cms_section_preview.html #}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ section.name }} — preview</title>
</head>
<body>
  <main>
    {% for block in section.content %}
      <section data-block="{{ block.block_type }}">
        {{ block }}
      </section>
    {% endfor %}
  </main>
</body>
</html>
