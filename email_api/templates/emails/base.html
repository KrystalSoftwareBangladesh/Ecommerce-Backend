<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Best Computer Hub{% endblock %}</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f5f8fc; font-family: Arial, Helvetica, sans-serif; color: #172033;">

    <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="width: 100%; margin: 0; padding: 0; background-color: #f5f8fc;"
    >
        <tr>
            <td align="center" style="padding: 32px 16px;">

                <table
                    role="presentation"
                    width="100%"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    style="width: 100%; max-width: 600px; background-color: #ffffff; border: 1px solid #e6ebf2; border-radius: 12px;"
                >

                    <!-- Header -->
                    <tr>
                        <td
                            align="center"
                            style="padding: 28px 32px; border-bottom: 1px solid #eef2f7;"
                        >
                            <img
                                src="cid:bchl-logo"
                                alt="Best Computer Hub"
                                width="64"
                                style="display: block; width: 64px; height: 64px; border: 0;"
                            >
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding: 36px 32px;">

                            {% block content %}
                            {% endblock %}

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td
                            style="padding: 24px 32px; border-top: 1px solid #eef2f7; background-color: #fafcff;"
                        >
                            <p
                                style="margin: 0 0 8px; font-size: 13px; line-height: 20px; color: #667085;"
                            >
                                Best Computer Hub Ltd
                            </p>

                            <p
                                style="margin: 0; font-size: 12px; line-height: 18px; color: #98a2b3;"
                            >
                                Your trusted technology retailer and online IT solutions provider.
                            </p>

                            <p
                                style="margin: 16px 0 0; font-size: 11px; line-height: 16px; color: #98a2b3;"
                            >
                                © {% now "Y" %} Best Computer Hub Ltd. All rights reserved.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
